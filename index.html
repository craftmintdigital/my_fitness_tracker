<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#05070f">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="AWAKEN">
  <title>AWAKEN — Fitness System</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="topbar">
    <div class="brand">AWAKEN<span>SYSTEM</span></div>
    <div class="top-meta" id="topMeta"></div>
  </header>

  <main id="view" aria-live="polite"></main>

  <nav class="tabs" id="tabs">
    <button data-tab="status" class="active"><span class="ico">◈</span>Status</button>
    <button data-tab="quests"><span class="ico">✦</span>Quests</button>
    <button data-tab="train"><span class="ico">⚔</span>Train</button>
    <button data-tab="plan"><span class="ico">▤</span>Plan</button>
    <button data-tab="records"><span class="ico">⎙</span>Records</button>
  </nav>

  <div class="modal-wrap" id="modalWrap" hidden>
    <div class="modal" role="dialog" aria-modal="true">
      <div class="modal-head">[ SYSTEM ]</div>
      <div class="modal-body" id="modalBody"></div>
      <div class="modal-actions" id="modalActions"></div>
    </div>
  </div>

  <input type="file" id="fileInput" accept=".txt,.json,text/plain,application/json" hidden>
  <script src="app.js"></script>
</body>
</html>
